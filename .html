<!DOCTYPE html>
<html>
<head>
  <title>No CSS Sharp Website</title>
</head>
<body>

  <h1>Welcome to My Sharp Webpage</h1>
  <p>This website uses pure HTML with zero CSS and no rounded corners.</p>

  <hr>

  <h2>Navigation</h2>
  <ul>
    <li><a href="#home">Home</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>

  <hr>

  <h2>Interactive Buttons</h2>
  
  <!-- Method 1: Native HTML Button -->
  <button type="button" onclick="alert('Hello! Sharp button clicked.')">Click Me (Button Tag)</button>

  <br><br>

  <!-- Method 2: Input Button -->
  <input type="button" value="Submit Input" onclick="alert('Input button clicked!')">

  <br><br>

  <!-- Method 3: Button inside a Form -->
  <form action="">
    <label for="username">Name:</label>
    <input type="text" id="username" name="username">
    <button type="submit">Send</button>
  </form>

</body>
</html>
